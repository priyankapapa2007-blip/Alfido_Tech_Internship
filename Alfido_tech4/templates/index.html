<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Fundamentals Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="card-title mb-4">Flask Fundamentals Demo</h1>
              <p class="text-muted">A simple Flask app showing routing, templates, form handling, and CRUD.</p>

              <form action="{{ url_for('manage_tasks') }}" method="post" class="row g-3 mb-4">
                <div class="col-md-5">
                  <input type="text" class="form-control" name="title" placeholder="Task title" required>
                </div>
                <div class="col-md-5">
                  <input type="text" class="form-control" name="description" placeholder="Task description">
                </div>
                <div class="col-md-2">
                  <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
              </form>

              <h2 class="h5">Tasks</h2>
              {% if tasks %}
                <ul class="list-group">
                  {% for task in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-start">
                      <div>
                        <strong>{{ task.title }}</strong>
                        <div class="text-muted">{{ task.description }}</div>
                      </div>
                      <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                      </form>
                    </li>
                  {% endfor %}
                </ul>
              {% else %}
                <div class="alert alert-info mt-3">No tasks yet. Add one above.</div>
              {% endif %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
